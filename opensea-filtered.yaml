        identifierOrCriteria:
          type: string
        startAmount:
          type: string
        endAmount:
          type: string
      required:
        - endAmount
        - identifierOrCriteria
        - itemType
        - startAmount
        - token
    NumericTraitData:
      type: object
      properties:
        type:
