components:
  schemas:
    ChainIdentifier:
      type: string
      default: ethereum
      description: Blockchain chain identifier. Use the chain slug (e.g., 'ethereum', 'polygon', 'arbitrum', 'optimism', 'base')
      enum:
        - blast
        - base
        - ethereum
        - zora
        - arbitrum
        - sei
        - avalanche
        - polygon
        - optimism
        - ape_chain
        - flow
        - b3
        - soneium
        - ronin
        - bera_chain
        - solana
        - shape
        - unichain
        - gunzilla
        - abstract
        - animechain
        - hyperevm
        - somnia
        - monad
        - hyperliquid
        - megaeth
        - ink
        - robinhood
        - stablechain
      example: ethereum
    ConsiderationItem:
      type: object
      properties:
        itemType:
          type: integer
          format: int32
        token:
          type: string
        identifierOrCriteria:
          type: string
        startAmount:
          type: string
        endAmount:
          type: string
        recipient:
          type: string
      required:
        - endAmount
        - identifierOrCriteria
        - itemType
        - recipient
        - startAmount
        - token
    CollectionInner:
      type: object
      properties:
        slug:
          type: string
      required:
        - slug
    ContractInner:
      type: object
      properties:
        address:
          type: string
      required:
        - address
    Criteria:
      type: object
      properties:
        collection:
          $ref: '#/components/schemas/CollectionInner'
        contract:
          $ref: '#/components/schemas/ContractInner'
        traits:
          type: array
          items:
            $ref: '#/components/schemas/TraitData'
        numeric_traits:
          type: array
          items:
            $ref: '#/components/schemas/NumericTraitData'
        encoded_token_ids:
          type: string
    Item:
