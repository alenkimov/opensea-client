extends:
  - recommended

plugins:
  - ./redocly-opensea-fixes.js

rules:
  info-license: off

apis:
  opensea:
    root: ./opensea-api.json

    decorators:
      opensea-fixes/fix-empty-event-schema: on
      opensea-fixes/make-pagination-next-nullable: on
      opensea-fixes/normalize-examples: on

      filter-in:
        applyTo: Operation
        property: operationId
        value:
          - list_events_by_account
          - list_events_by_collection
          - list_events_by_nft
          - get_top_collections
          - get_collection
          - get_collection_stats
          - get_collection_offer_aggregates
          - get_nfts_by_collection
          - get_nfts_by_account
          - get_nft
          - get_token_balances_by_account
          - get_profile_offers_received
          - get_profile_offers
          - get_profile_listings
          - get_best_offer_nft
          - get_best_listing_nft
          - get_best_listings_collection

      remove-unused-components: on
