[project]
name = "opensea"
version = "0.1.0"
description = "async Python client for the OpenSea API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "better-proxy>=1.3.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opensea"]

[tool.ruff]
target-version = "py313"
line-length = 100
